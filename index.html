        function POSKasir({ menus, adminQrisUrl, onCreateOrder, showAlert, storeStatus }) {
            const [cart, setCart] = useState([]);
            const [selectedCategory, setSelectedCategory] = useState('Semua');
            const [paymentMethod, setPaymentMethod] = useState('Tunai');
            const [qrisProof, setQrisProof] = useState('');

            if(!storeStatus.posOpen) {
                return (
                    <div className="flex flex-col items-center justify-center h-full w-full text-center p-8">
                        <div className="bg-[#141414] border-2 border-red-500/50 p-8 rounded-2xl max-w-lg w-full shadow-2xl space-y-4">
                            <i className="fa-solid fa-cash-register text-5xl text-red-500 mb-2"></i>
                            <h2 className="text-xl font-serif font-bold text-white">Kasir POS Sedang Tutup</h2>
                            <p className="text-gray-400 text-xs bg-black p-4 rounded border border-gray-800">{storeStatus.posReason || 'Kasir tutup sementara.'}</p>
                        </div>
                    </div>
                );
            }

            const addToCart = (item) => {
                if (!item.available) return showAlert("Maaf, menu ini sedang HABIS!");
                setCart(prev => { const ex = prev.find(c => c.id === item.id); return ex ? prev.map(c => c.id === item.id ? {...c, qty: c.qty + 1} : c) : [...prev, {...item, qty: 1}]; });
            };
            const removeCart = (id) => setCart(prev => { const ex = prev.find(c => c.id === id); return ex.qty > 1 ? prev.map(c => c.id === id ? {...c, qty: c.qty - 1} : c) : prev.filter(c => c.id !== id); });
            const total = cart.reduce((s, c) => s + (c.price * c.qty), 0);

            const categories = ['Semua', 'Spesial', 'Paket', 'Nasi', 'Ayam', 'Ikan', 'Telur', 'Sayur-sayuran', 'Minuman'];
            const filteredMenus = selectedCategory === 'Semua' ? menus : menus.filter(m => m.category === selectedCategory);

            const onPay = () => {
                if(!cart.length) return showAlert("Keranjang kosong!");
                if(paymentMethod === 'QRIS' && !qrisProof) return showAlert("Upload bukti QRIS!");
                onCreateOrder({
                    type: 'Kasir POS', customer: 'Walk-in', santriName: 'Umum',
                    santriClass: 'Outlet', santriRayon: 'Langsung', pickupTime: 'Langsung', catatan: 'POS',
                    details: 'POS Kasir', payment: paymentMethod, qrisProof, total,
                    itemsList: cart.map(c => ({...c, subtotal: c.price*c.qty}))
                });
                setCart([]); setQrisProof('');
            };

            return (
                <div className="flex flex-col lg:flex-row gap-4 h-full w-full overflow-hidden">
                    <div className="flex-1 lg:flex-[1.8] bg-[#121212]/95 backdrop-blur-md p-4 rounded-xl border border-[#D4AF37]/20 h-full overflow-y-auto flex flex-col">
                        <div className="flex items-center gap-2 overflow-x-auto pb-3 shrink-0">
                            {categories.map(cat => (
                                <button key={cat} onClick={()=>setSelectedCategory(cat)} className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${selectedCategory === cat ? 'bg-[#D4AF37] text-black shadow-lg shadow-[#D4AF37]/30' : 'bg-[#0A0A0A] text-gray-400 hover:text-white border border-gray-800'}`}>
                                    {cat}
                                </button>
                            ))}
                        </div>

                        <div className="flex-1 overflow-y-auto pr-1 pb-2">
                            <div className="grid grid-cols-2 gap-3">
                                {filteredMenus.map(m => {
                                    const inCart = cart.find(c => c.id === m.id);
                                    const isSpecial = m.category === 'Spesial';
                                    const isPackage = m.category === 'Paket';
                                    const cardStyleClass = isSpecial ? "special-glow" : (isPackage ? "package-glow" : "bg-[#0A0A0A] border-gray-800");

                                    return (
                                        <div key={m.id} className={`p-3 rounded-xl border relative flex flex-col justify-between menu-card-hover ${cardStyleClass} ${!m.available ? 'opacity-50 grayscale' : ''}`}>
                                            {isSpecial && (
                                                <div className="absolute top-2 right-2 bg-gradient-to-r from-[#D4AF37] to-amber-600 text-black text-[9px] font-extrabold px-2 py-0.5 rounded-full shadow z-10 tracking-widest uppercase">
                                                    <i className="fa-solid fa-crown mr-1"></i> Spesial
                                                </div>
                                            )}
                                            {isPackage && (
                                                <div className="absolute top-2 right-2 bg-[#1A1A1A] border border-[#D4AF37]/60 text-[#D4AF37] text-[9px] font-bold px-2 py-0.5 rounded-full shadow z-10 tracking-wider uppercase">
                                                    <i className="fa-solid fa-box-open mr-1"></i> Paket
                                                </div>
                                            )}
                                            {inCart && <span className="absolute top-2 left-2 bg-[#D4AF37] text-black text-[10px] font-bold px-2 py-0.5 rounded z-10 flex items-center gap-1"><i className="fa-solid fa-plus text-[8px]"></i> {inCart.qty}</span>}
                                            {!m.available && <div className="absolute inset-0 bg-black/70 z-20 flex items-center justify-center font-bold text-red-500 text-xs tracking-wider uppercase border border-red-500/50 rounded">Habis</div>}
                                            <div>
                                                <div className="relative overflow-hidden rounded mb-2">
                                                    <img src={m.image} className="w-full h-20 object-cover rounded transition-transform duration-500 hover:scale-110" />
                                                </div>
                                                <div className="text-xs font-bold text-white truncate">{m.name}</div>
                                                <div className="text-[#D4AF37] text-xs font-bold mt-1">Rp {m.price.toLocaleString()}</div>
                                            </div>

                                            <div className="mt-2">
                                                {inCart ? (
                                                    <div className="flex items-center justify-between w-full bg-black border border-[#D4AF37] rounded px-2 py-1">
                                                        <button onClick={()=>removeCart(m.id)} className="text-[#D4AF37] font-bold px-2"><i className="fa-solid fa-minus text-[10px]"></i></button>
                                                        <span className="text-xs font-bold text-white">{inCart.qty}</span>
                                                        <button onClick={()=>addToCart(m)} className="text-[#D4AF37] font-bold px-2"><i className="fa-solid fa-plus text-[10px]"></i></button>
                                                    </div>
                                                ) : (
                                                    <button disabled={!m.available} onClick={()=>addToCart(m)} className={btnClass + " w-full !py-1 text-[10px]"}>
                                                        {m.available ? '+ Tambah' : 'Habis'}
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 lg:flex-[1] bg-[#121212]/95 backdrop-blur-md p-4 rounded-xl border border-[#D4AF37]/40 flex flex-col h-full overflow-y-auto">
                        <h2 className="text-[#D4AF37] font-bold text-sm mb-3 pb-2 border-b border-gray-800">Pesanan Outlet</h2>
                        <div className="flex-1 overflow-y-auto space-y-2 mb-3 max-h-56 pr-1">
                            {cart.map((c, i) => (
                                <div key={i} className="flex justify-between items-center text-xs text-white bg-[#0A0A0A] p-2 rounded">
                                    <span>{c.name} ({c.qty}x)</span>
                                    <span className="text-[#D4AF37] font-bold">Rp {(c.price*c.qty).toLocaleString()}</span>
                                </div>
                            ))}
                        </div>
                        <div className="space-y-3 pt-2 border-t border-gray-800">
                            <div className="flex justify-between bg-black p-2.5 rounded border border-[#D4AF37]/30">
                                <span className="text-xs font-bold text-gray-400">Total</span>
                                <span className="text-base md:text-lg text-[#D4AF37] font-bold">Rp {total.toLocaleString()}</span>
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <button onClick={()=>setPaymentMethod('Tunai')} className={`py-2 text-xs font-bold rounded border transition-all ${paymentMethod === 'Tunai' ? 'bg-[#D4AF37] text-black border-[#D4AF37] shadow' : 'bg-black text-gray-300 border-gray-800 hover:border-[#D4AF37]/50'}`}>
                                    <i className="fa-solid fa-money-bill-wave mr-1"></i> Tunai (Cash)
                                </button>
                                <button onClick={()=>setPaymentMethod('QRIS')} className={`py-2 text-xs font-bold rounded border transition-all ${paymentMethod === 'QRIS' ? 'bg-[#D4AF37] text-black border-[#D4AF37] shadow' : 'bg-black text-gray-300 border-gray-800 hover:border-[#D4AF37]/50'}`}>
                                    <i className="fa-solid fa-qrcode mr-1"></i> QRIS
                                </button>
                            </div>
                            {paymentMethod === 'QRIS' && (
                                <div className="bg-black p-2.5 rounded text-center space-y-1">
                                    <img src={adminQrisUrl} className="w-20 h-20 object-contain mx-auto bg-white p-1 rounded" />
                                    <input type="file" accept="image/*" onChange={e => {
                                        const f = e.target.files[0];
                                        if(f) { const r = new FileReader(); r.onload = () => setQrisProof(r.result); r.readAsDataURL(f); }
                                    }} className="w-full text-[9px] text-gray-400" />
                                </div>
                            )}
                            <button onClick={onPay} className={btnClass + " w-full py-2.5"}>Proses Bayar</button>
                        </div>
                    </div>
                </div>
            );
        }

        function AdminDashboard({ transactions, setTransactions, menus, setMenus, adminQrisUrl, setAdminQrisUrl, showAlert, storeStatus, setStoreStatus, downloadNotaAsText }) {
            const [adminTab, setAdminTab] = useState('history');
            const [quarterFilter, setQuarterFilter] = useState('ALL');
            const [selectedTrxProof, setSelectedTrxProof] = useState(null);

            const [financeForm, setFinanceForm] = useState({
                nominal: '', category: 'PEMBAYARAN CASH', note: '', proofImage: ''
            });

            const [savingForm, setSavingForm] = useState({
                nominal: '', date: new Date().toISOString().split('T')[0], note: '', proofImage: ''
            });

            const [hppData, setHppData] = useState({
                bahanBaku: 5000,
                overhead: 1000,
                porsi: 1,
                targetMargin: 30
            });
            const hppTotal = (Number(hppData.bahanBaku) + Number(hppData.overhead)) / (Number(hppData.porsi) || 1);
            const hppJualRekomendasi = hppTotal * (1 + Number(hppData.targetMargin) / 100);

            const getHijriQuarter = (dateStr) => {
                const d = new Date(dateStr);
                const m = (d.getMonth() + 3) % 12 + 1;
                if (m <= 3) return 'Q1';
                if (m <= 6) return 'Q2';
                if (m <= 9) return 'Q3';
                return 'Q4';
            };

            const totalInCash = transactions.filter(t => t.type === 'IN' && (t.category === 'PEMBAYARAN CASH' || t.paymentMethod === 'Tunai')).reduce((s, t) => s + t.amount, 0);
            const totalInQRIS = transactions.filter(t => t.type === 'IN' && (t.category === 'PEMBAYARAN QRIS' || t.paymentMethod === 'QRIS')).reduce((s, t) => s + t.amount, 0);
            const totalOut = transactions.filter(t => t.type === 'OUT').reduce((s, t) => s + t.amount, 0);
            const totalSaving = transactions.filter(t => t.category === 'TABUNGAN TOKO').reduce((s, t) => s + t.amount, 0);
            
            const filteredTransactions = transactions.filter(t => {
                if (quarterFilter === 'ALL') return true;
                return getHijriQuarter(t.date) === quarterFilter;
            });

            const quarterlyIn = filteredTransactions.filter(t => t.type === 'IN').reduce((s, t) => s + t.amount, 0);
            const quarterlyOut = filteredTransactions.filter(t => t.type === 'OUT').reduce((s, t) => s + t.amount, 0);

            const handleDeleteTransaction = (id) => {
                if(confirm("Apakah Anda yakin ingin menghapus riwayat transaksi ini?")) {
                    setTransactions(transactions.filter(t => t.id !== id));
                    showAlert("Riwayat transaksi berhasil dihapus.", "success");
                }
            };

            const handleAddFinance = (e) => {
                e.preventDefault();
                if(!financeForm.nominal) return showAlert("Masukkan nominal keuangan!");
                const amount = Number(financeForm.nominal);
                const isOut = financeForm.category === 'UANG KELUAR';
                const trx = {
                    id: generateId('FIN'),
                    date: new Date().toISOString(),
                    type: isOut ? 'OUT' : 'IN',
                    category: financeForm.category,
                    paymentMethod: isOut ? 'Keluar' : 'Cash',
                    amount: amount,
                    note: financeForm.note || financeForm.category,
                    proofImage: financeForm.proofImage || ''
                };
                setTransactions([trx, ...transactions]);
                setFinanceForm({ nominal: '', category: 'PEMBAYARAN CASH', note: '', proofImage: '' });
                showAlert("Pencatatan keuangan berhasil disimpan!", "success");
            };

            const handleAddSaving = (e) => {
                e.preventDefault();
                if(!savingForm.nominal) return showAlert("Masukkan nominal tabungan harian!");
                const trx = {
                    id: generateId('SAV'),
                    date: new Date(savingForm.date).toISOString(),
                    type: 'IN',
                    category: 'TABUNGAN TOKO',
                    paymentMethod: 'Tabungan',
                    amount: Number(savingForm.nominal),
                    note: savingForm.note ? `Tabungan Harian: ${savingForm.note}` : `Tabungan Harian (${savingForm.date})`,
                    proofImage: savingForm.proofImage || ''
                };
                setTransactions([trx, ...transactions]);
                setSavingForm({ nominal: '', date: new Date().toISOString().split('T')[0], note: '', proofImage: '' });
                showAlert("Tabungan toko harian berhasil dicatat!", "success");
            };

            const [mForm, setMForm] = useState({ id: '', name: '', price: '', category: 'Spesial', image: '', description: '', available: true });
            const saveMenu = (e) => {
                e.preventDefault();
                const item = {
                    id: mForm.id || generateId('MN'),
                    name: mForm.name, price: parseInt(mForm.price),
                    category: mForm.category, description: mForm.description || 'Menu lezat pilihan La-Tansa',
                    image: mForm.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300&h=200',
                    available: mForm.available
                };
                if(mForm.id) setMenus(menus.map(m => m.id === mForm.id ? item : m));
                else setMenus([item, ...menus]);
                showAlert("Menu berhasil disimpan!", "success");
                setMForm({ id: '', name: '', price: '', category: 'Spesial', image: '', description: '', available: true });
            };

            const toggleStock = (id) => {
                setMenus(menus.map(m => {
                    if (m.id === id) {
                        const newStatus = !m.available;
                        showAlert(`Stok ${m.name} diubah menjadi: ${newStatus ? 'Tersedia' : 'Habis'}`, "success");
                        return {...m, available: newStatus};
                    }
                    return m;
                }));
            };

            return (
                <div className="bg-[#0D0D0D]/95 backdrop-blur-xl p-5 md:p-6 rounded-2xl border border-[#D4AF37]/30 shadow-2xl h-full w-full flex flex-col overflow-hidden relative">
                    {selectedTrxProof && (
                        <div className="absolute inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                            <div className="bg-[#141414] border border-[#D4AF37] p-6 rounded-2xl max-w-sm w-full text-center space-y-4 shadow-2xl">
                                <h3 className="text-sm font-bold text-[#D4AF37] font-serif">Bukti / Nota Foto</h3>
                                <img src={selectedTrxProof} className="w-48 h-48 object-contain mx-auto bg-white p-2 rounded-xl border border-[#D4AF37]/30" />
                                <button onClick={()=>setSelectedTrxProof(null)} className={btnClass + " w-full"}>Tutup</button>
                            </div>
                        </div>
                    )}

                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center border-b border-[#D4AF37]/20 pb-4 mb-5 gap-4 shrink-0 bg-gradient-to-r from-[#121212] via-[#181818] to-[#121212] p-4 rounded-xl border border-[#D4AF37]/25 shadow-lg">
                        <div className="flex items-center gap-2 md:gap-3 overflow-x-auto w-full pb-2" style={{scrollbarWidth: 'thin'}}>
                            <button onClick={()=>setAdminTab('history')} className={`px-3.5 py-2 rounded-xl font-bold uppercase text-[11px] tracking-wider transition-all flex items-center gap-2 whitespace-nowrap shrink-0 ${adminTab === 'history' ? 'bg-[#D4AF37] text-black shadow-lg shadow-[#D4AF37]/30' : 'bg-[#1A1A1A] text-gray-400 hover:text-white border border-gray-800'}`}>
                                <i className="fa-solid fa-clock-rotate-left"></i> Riwayat Pembelian
                            </button>
                            <button onClick={()=>setAdminTab('finance')} className={`px-3.5 py-2 rounded-xl font-bold uppercase text-[11px] tracking-wider transition-all flex items-center gap-2 whitespace-nowrap shrink-0 ${adminTab === 'finance' ? 'bg-[#D4AF37] text-black shadow-lg shadow-[#D4AF37]/30' : 'bg-[#1A1A1A] text-gray-400 hover:text-white border border-gray-800'}`}>
                                <i className="fa-solid fa-wallet"></i> Pencatatan Keuangan
                            </button>
                            <button onClick={()=>setAdminTab('quarter')} className={`px-3.5 py-2 rounded-xl font-bold uppercase text-[11px] tracking-wider transition-all flex items-center gap-2 whitespace-nowrap shrink-0 ${adminTab === 'quarter' ? 'bg-[#D4AF37] text-black shadow-lg shadow-[#D4AF37]/30' : 'bg-[#1A1A1A] text-gray-400 hover:text-white border border-gray-800'}`}>
                                <i className="fa-solid fa-calendar-days"></i> Laporan Triwulan
                            </button>
                            <button onClick={()=>setAdminTab('hpp')} className={`px-3.5 py-2 rounded-xl font-bold uppercase text-[11px] tracking-wider transition-all flex items-center gap-2 whitespace-nowrap shrink-0 ${adminTab === 'hpp' ? 'bg-[#D4AF37] text-black shadow-lg shadow-[#D4AF37]/30' : 'bg-[#1A1A1A] text-gray-400 hover:text-white border border-gray-800'}`}>
                                <i className="fa-solid fa-calculator"></i> Kalkulator HPP
                            </button>
                            <button onClick={()=>setAdminTab('menu')} className={`px-3.5 py-2 rounded-xl font-bold uppercase text-[11px] tracking-wider transition-all flex items-center gap-2 whitespace-nowrap shrink-0 ${adminTab === 'menu' ? 'bg-[#D4AF37] text-black shadow-lg shadow-[#D4AF37]/30' : 'bg-[#1A1A1A] text-gray-400 hover:text-white border border-gray-800'}`}>
                                <i className="fa-solid fa-utensils"></i> Kelola Menu & Katalog
                            </button>
                        </div>
                        <div className="flex items-center gap-3 bg-black/60 px-4 py-2 rounded-xl border border-[#D4AF37]/30 text-xs shrink-0">
                            <div className="flex items-center gap-2">
                                <span className="text-gray-400 font-medium">Online:</span>
                                <button onClick={()=>setStoreStatus({...storeStatus, onlineOpen: !storeStatus.onlineOpen})} className={`px-2.5 py-1 rounded-lg font-bold transition-all shadow ${storeStatus.onlineOpen ? 'bg-emerald-600 text-white shadow-emerald-900/50' : 'bg-red-600 text-white shadow-red-900/50'}`}>{storeStatus.onlineOpen ? 'BUKA' : 'TUTUP'}</button>
                            </div>
                            <div className="h-4 w-[1px] bg-gray-800"></div>
                            <div className="flex items-center gap-2">
                                <span className="text-gray-400 font-medium">Kasir:</span>
                                <button onClick={()=>setStoreStatus({...storeStatus, posOpen: !storeStatus.posOpen})} className={`px-2.5 py-1 rounded-lg font-bold transition-all shadow ${storeStatus.posOpen ? 'bg-emerald-600 text-white shadow-emerald-900/50' : 'bg-red-600 text-white shadow-red-900/50'}`}>{storeStatus.posOpen ? 'BUKA' : 'TUTUP'}</button>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto pr-1 space-y-5 h-full">
                        {adminTab === 'history' && (

                                            <input type="number" value={hppData.targetMargin} onChange={e=>setHppData({...hppData, targetMargin: e.target.value})} className={inputClass} />
                                        </div>
                                    </div>
                                    <div className="bg-black p-4 rounded-xl border border-[#D4AF37]/40 mt-4 space-y-2">
                                        <div className="flex justify-between items-center text-gray-300"><span>HPP per Porsi:</span><b className="text-white text-sm font-mono">Rp {Math.round(hppTotal).toLocaleString()}</b></div>
                                        <div className="flex justify-between items-center pt-2 border-t border-gray-800 text-gray-300"><span>Rekomendasi Harga Jual:</span><b className="text-[#D4AF37] text-base font-mono">Rp {Math.round(hppJualRekomendasi).toLocaleString()}</b></div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {adminTab === 'menu' && (
                            <div className="space-y-6">
                                <div className="bg-[#121212] p-5 rounded-2xl border border-[#D4AF37]/30 shadow-xl max-w-md">
                                    <h4 className="text-xs font-serif font-bold text-[#D4AF37] uppercase mb-3 flex items-center gap-2">
                                        <i className="fa-solid fa-store"></i> Pengaturan Keterangan Toko Tutup
                                    </h4>
                                    <div className="space-y-3">
                                        <div>
                                            <label className="text-[10px] text-gray-400 uppercase font-bold block mb-1">Alasan Tutup Online</label>
                                            <input type="text" value={storeStatus.onlineReason} onChange={e=>setStoreStatus({...storeStatus, onlineReason: e.target.value})} className={inputClass} placeholder="Contoh: Istirahat / Persiapan bahan..." />
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-gray-400 uppercase font-bold block mb-1">Alasan Tutup Kasir POS</label>
                                            <input type="text" value={storeStatus.posReason} onChange={e=>setStoreStatus({...storeStatus, posReason: e.target.value})} className={inputClass} placeholder="Contoh: Kasir sedang rehat..." />
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-[#121212] p-5 rounded-2xl border border-[#D4AF37]/30 shadow-xl max-w-md">
                                    <h4 className="text-xs font-serif font-bold text-[#D4AF37] uppercase mb-3 flex items-center gap-2">
                                        <i className="fa-solid fa-qrcode"></i> Pengaturan QRIS Toko (Upload dari Device)
                                    </h4>
                                    <div className="flex items-center gap-4">
                                        <img src={adminQrisUrl} className="w-24 h-24 object-contain bg-white p-1 rounded-xl border border-[#D4AF37]/40 shadow" />
                                        <div className="space-y-2.5 flex-1">
                                            <input type="file" accept="image/*" onChange={e=>{
                                                const f = e.target.files[0];
                                                if(f) {
                                                    const r = new FileReader();
                                                    r.onload = () => {
                                                        setAdminQrisUrl(r.result);
                                                        showAlert("QRIS Toko Berhasil Diperbarui dari Device", "success");
                                                    };
                                                    r.readAsDataURL(f);
                                                }
                                            }} className="w-full text-xs text-gray-400 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-bold file:bg-[#D4AF37] file:text-black hover:file:brightness-110" />
                                        </div>
                                    </div>
                                </div>

                                <div className="flex flex-col lg:flex-row gap-5">
                                    <div className="w-full lg:w-80 bg-[#121212] p-5 rounded-2xl border border-[#D4AF37]/30 shadow-xl h-fit">
                                        <h4 className="text-xs font-serif font-bold text-[#D4AF37] uppercase mb-3.5 flex items-center gap-2">
                                            <i className="fa-solid fa-plus-circle"></i> Tambah / Edit Menu
                                        </h4>
                                        <form onSubmit={saveMenu} className="space-y-3">
                                            <input required placeholder="Nama Menu" value={mForm.name} onChange={e=>setMForm({...mForm, name: e.target.value})} className={inputClass} />
                                            <input required type="number" placeholder="Harga (Rp)" value={mForm.price} onChange={e=>setMForm({...mForm, price: e.target.value})} className={inputClass} />
                                            <select value={mForm.category} onChange={e=>setMForm({...mForm, category: e.target.value})} className={inputClass}>
                                                <option value="Spesial">Spesial</option>
                                                <option value="Paket">Paket A-D</option>
                                                <option value="Nasi">Nasi</option>
                                                <option value="Ayam">Ayam</option>
                                                <option value="Ikan">Ikan</option>
                                                <option value="Telur">Telur</option>
                                                <option value="Sayur-sayuran">Sayur-sayuran</option>
                                                <option value="Minuman">Minuman</option>
                                            </select>
                                            <input placeholder="Deskripsi Singkat" value={mForm.description} onChange={e=>setMForm({...mForm, description: e.target.value})} className={inputClass} />
                                            <div>
                                                <label className="text-[10px] text-[#D4AF37] font-bold block mb-1">UPLOAD GAMBAR MENU DARI DEVICE</label>
                                                <input type="file" accept="image/*" onChange={e=>{
                                                    const f = e.target.files[0];
                                                    if(f) {
                                                        const r = new FileReader();
                                                        r.onload = () => setMForm({...mForm, image: r.result});
                                                        r.readAsDataURL(f);
                                                    }
                                                }} className="w-full text-xs text-gray-400 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-bold file:bg-[#D4AF37] file:text-black hover:file:brightness-110" />
                                            </div>
                                            {mForm.image && <img src={mForm.image} className="w-16 h-16 object-cover rounded border border-[#D4AF37]" />}
                                            <button type="submit" className={btnClass + " w-full py-2.5 mt-1"}>Simpan Menu</button>
                                        </form>
                                    </div>
                                    <div className="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                                        {menus.map(m => (
                                            <div key={m.id} className="bg-[#121212] p-3.5 rounded-xl border border-gray-800 flex justify-between items-center shadow hover:border-[#D4AF37]/50 transition-all">
                                                <div className="flex items-center gap-3">
                                                    <img src={m.image} className="w-12 h-12 object-cover rounded-lg border border-gray-800" />
                                                    <div>
                                                        <div className="text-xs font-bold text-white">{m.name} <span className="text-[9px] text-[#D4AF37] block font-normal">({m.category})</span></div>
                                                        <div className="text-[10px] text-gray-400 font-mono mt-0.5">Rp {m.price.toLocaleString()}</div>
                                                    </div>
                                                </div>
                                                <div className="flex gap-2 items-center">
                                                    <button onClick={()=>toggleStock(m.id)} className={`px-2.5 py-1 text-[10px] font-bold rounded-lg shadow ${m.available ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'}`}>
                                                        {m.available ? 'Tersedia' : 'Habis'}
                                                    </button>
                                                    <button onClick={()=>setMForm(m)} className="text-blue-400 hover:text-blue-300 text-xs p-1"><i className="fa-solid fa-pen"></i></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles;

        function initParticles() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 2 + 1,
                    dx: (Math.random() - 0.5) * 0.5,
                    dy: (Math.random() - 0.5) * 0.5,
                    opacity: Math.random() * 0.5 + 0.2
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.dx; p.y += p.dy;
                if (p.x < 0 || p.x > width) p.dx *= -1;
                if (p.y < 0 || p.y > height) p.dy *= -1;
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(212, 175, 55, ${p.opacity})`;
                ctx.fill();
            }
            
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 90) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(212, 175, 55, ${0.12 * (1 - dist / 90)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animateParticles);
        }
        
        initParticles();
        animateParticles();
        window.addEventListener('resize', initParticles);

        document.addEventListener('click', function(e) {
            const ripple = document.createElement('div');
            ripple.className = 'click-ripple';
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });
    </script>
</body>
</html>
