<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La-Tansa Cafe & Resto - Sistem Utama</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #030303; 
            color: #E5E7EB; 
            margin: 0; padding: 0; overflow: hidden;
        }
        .font-serif { font-family: 'Playfair Display', serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #0A0A0A; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 4px; }
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 12s infinite alternate ease-in-out; }
        .special-glow {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.22) 0%, rgba(15, 15, 15, 0.98) 100%);
            border: 1px solid rgba(212, 175, 55, 0.8);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .package-glow {
            background: linear-gradient(135deg, rgba(40, 35, 20, 0.95) 100%, rgba(12, 12, 12, 0.98));
            border: 1px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @media print { 
            .no-print { display: none !important; } 
            body { background-color: #FFFFFF !important; color: #000 !important; overflow: auto !important; } 
            .printable-receipt { background: #FFFFFF !important; color: #000 !important; border: none !important; box-shadow: none !important; width: 100% !important; max-width: none !important; }
        }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
        .click-ripple {
            position: fixed; border-radius: 50%; border: 2px solid #D4AF37;
            pointer-events: none; transform: translate(-50%, -50%) scale(0);
            animation: ripple 0.6s ease-out forwards; z-index: 9999;
        }
        @keyframes ripple {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; box-shadow: 0 0 15px #D4AF37; }
            100% { transform: translate(-50%, -50%) scale(3.5); opacity: 0; }
        }
        .menu-card-hover {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .menu-card-hover:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.3);
            border-color: #D4AF37;
        }
        .menu-card-hover:active {
            transform: scale(0.97);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const INITIAL_SPECIAL = [
            { id: 'sp-1', name: 'Nasi Kebuli Sultan', price: 45000, description: 'Daging Kambing Empuk + Rempah Khas Arab', image: 'https://images.unsplash.com/photo-1631515243349-e0cb75fb8d3a?w=400&h=300&fit=crop', category: 'Spesial', available: true },
            { id: 'sp-2', name: 'Ayam Bakar Madu Royal', price: 28000, description: 'Ayam Pejantan + Olesan Madu Hutan Murni', image: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=400&h=300&fit=crop', category: 'Spesial', available: true }
        ];

        const INITIAL_PACKAGES = [
            { id: 'pkt-A', name: 'Paket A (Hemat Santri)', price: 10000, description: 'Nasi + Ayam Sayur + Es Teh Manis', image: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300&h=200&fit=crop', category: 'Paket', available: true },
            { id: 'pkt-B', name: 'Paket B (Spesial Santri)', price: 13000, description: 'Nasi + Ayam Lengkuas + Telur + Sayur', image: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=300&h=200&fit=crop', category: 'Paket', available: true },
            { id: 'pkt-C', name: 'Paket C (Seafood Nusantara)', price: 16000, description: 'Nasi + Ikan Nila Bakar Madu + Lalapan', image: 'https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=300&h=200&fit=crop', category: 'Paket', available: true },
            { id: 'pkt-D', name: 'Paket D (Premium Sapi)', price: 22000, description: 'Nasi + Daging Sapi Lada Hitam + Kuah', image: 'https://images.unsplash.com/photo-1525385133512-2f3bdd039054?w=300&h=200&fit=crop', category: 'Paket', available: true }
        ];

        const INITIAL_MENU = [
            { id: 'n-1', name: 'Nasi Putih', price: 4000, description: 'Nasi Putih Pulen', image: 'https://images.unsplash.com/photo-1516684732162-798a0062be99?w=300&h=200&fit=crop', category: 'Nasi', available: true },
            { id: 'n-2', name: 'Nasi Kuning', price: 6000, description: 'Nasi Kuning Rempah', image: 'https://images.unsplash.com/photo-1541529086526-db283c563270?w=300&h=200&fit=crop', category: 'Nasi', available: true },
            { id: 'n-3', name: 'Nasi Daun Jeruk', price: 6000, description: 'Nasi Wangi Daun Jeruk', image: 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=300&h=200&fit=crop', category: 'Nasi', available: true },
            { id: 'a-1', name: 'Ayam Kecap', price: 6000, description: 'Ayam Kuah Kecap Gurih', image: 'https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=300&h=200&fit=crop', category: 'Ayam', available: true },
            { id: 'a-2', name: 'Ayam Balado', price: 6000, description: 'Ayam Sambal Balado', image: 'https://images.unsplash.com/photo-1588166524941-3bf61a9c41db?w=300&h=200&fit=crop', category: 'Ayam', available: true },
            { id: 'a-3', name: 'Ayam Opor', price: 6000, description: 'Ayam Kuah Putih Opor', image: 'https://images.unsplash.com/photo-1598514982205-f36b96d1e8d4?w=300&h=200&fit=crop', category: 'Ayam', available: true },
            { id: 'a-4', name: 'Ayam Asam Manis', price: 6000, description: 'Ayam Saus Asam Manis', image: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=300&h=200&fit=crop', category: 'Ayam', available: true },
            { id: 'a-5', name: 'Ayam Kremes', price: 6000, description: 'Ayam Goreng Kremes Renyah', image: 'https://images.unsplash.com/photo-1626777552726-4a6b54c97e46?w=300&h=200&fit=crop', category: 'Ayam', available: true },
            { id: 'i-1', name: 'Ikan Lele', price: 6000, description: 'Lele Goreng Renyah', image: 'https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=300&h=200&fit=crop', category: 'Ikan', available: true },
            { id: 'i-2', name: 'Ikan Goreng', price: 7000, description: 'Ikan Segar Bumbu Kuning', image: 'https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?w=300&h=200&fit=crop', category: 'Ikan', available: true },
            { id: 't-1', name: 'Telur Dadar', price: 5000, description: 'Telur Dadar Rempah', image: 'https://images.unsplash.com/photo-1525385133512-2f3bdd039054?w=300&h=200&fit=crop', category: 'Telur', available: true },
            { id: 't-2', name: 'Telur Ceplok', price: 5000, description: 'Telur Ceplok Mata Sapi', image: 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=300&h=200&fit=crop', category: 'Telur', available: true },
            { id: 's-1', name: 'Sayur Kangkung', price: 4000, description: 'Kangkung Tumis Bawang', image: 'https://images.unsplash.com/photo-1540420773420-3366772f4999?w=300&h=200&fit=crop', category: 'Sayur-sayuran', available: true },
            { id: 's-2', name: 'Sayur Sop', price: 4000, description: 'Sop Hangat Segar', image: 'https://images.unsplash.com/photo-1547592180-85f173990554?w=300&h=200&fit=crop', category: 'Sayur-sayuran', available: true },
            { id: 'b-1', name: 'Es Teh Manis', price: 3000, description: 'Teh Manis Dingin Segar', image: 'https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=300&h=200&fit=crop', category: 'Minuman', available: true }
        ];

        const btnClass = "bg-gradient-to-r from-[#D4AF37] to-[#AA821C] text-[#030303] py-2 px-3 rounded font-bold hover:brightness-110 transition-all shadow-md border-none cursor-pointer text-xs uppercase tracking-wider";
        const inputClass = "w-full p-2.5 bg-[#080808] border border-[#D4AF37]/40 rounded focus:outline-none focus:border-[#D4AF37] text-xs text-[#E5E7EB] placeholder-gray-600";
        const cardClass = "bg-[#0D0D0D]/95 backdrop-blur-md p-4 md:p-5 rounded-xl border border-[#D4AF37]/30 shadow-2xl";

        const playOrderSuccessSoundAndSpeech = (totalAmount) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                const chord = [523.25, 659.25, 783.99, 1046.50]; 
                chord.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.1);
                    gain.gain.setValueAtTime(0.2, now + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + i * 0.1);
                    osc.stop(now + i * 0.1 + 0.5);
                });

                if ('speechSynthesis' in window) {
                    setTimeout(() => {
                        const formattedRp = totalAmount.toLocaleString('id-ID');
                        const speechText = `Terima kasih! Pesanan berhasil dibuat dengan total pembayaran ${formattedRp} rupiah. Anda berbelanja, Anda beramal.`;
                        const utterance = new SpeechSynthesisUtterance(speechText);
                        utterance.lang = 'id-ID';
                        utterance.rate = 1.0;
                        utterance.pitch = 1.1;
                        window.speechSynthesis.speak(utterance);
                    }, 500);
                }
            } catch(e) {
                console.log("Audio/Speech error:", e);
            }
        };

        const generateWaLink = (order) => {
            const phone = "6288991753641"; 
            const itemsText = order.itemsList ? order.itemsList.map(i => `- ${i.name} (${i.qty}x) = Rp ${i.subtotal.toLocaleString('id-ID')}`).join('\n') : '-';
            const text = `*NOTA RESMI LA-TANSA*\n\n*ID:* ${order.id}\n*Pemesan:* ${order.customer}\n*Santri:* ${order.santriName || '-'}\n*Kelas/Rayon:* ${order.santriClass || '-'} / ${order.santriRayon || '-'}\n*Jam Pengambilan:* ${order.pickupTime || '-'}\n*Catatan:* ${order.catatan || '-'}\n\n*Pesanan:*\n${itemsText}\n\n*Metode:* ${order.payment}\n*Total:* Rp ${order.total.toLocaleString('id-ID')}\n\nTerima Kasih Telah Berbelanja & Beramal.`;
            return `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(text)}`;
        };

        const generateId = (prefix) => `${prefix}-${Math.floor(Math.random() * 90000) + 10000}`;

        function CustomModal({ isOpen, message, onClose, type = 'error' }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                    <div className="bg-[#1A1A1A] border-2 border-[#D4AF37] p-6 rounded-xl max-w-sm w-full text-center shadow-2xl">
                        <div className="flex justify-center mb-4 text-[#D4AF37]">
                            {type === 'error' ? <i className="fa-solid fa-circle-exclamation text-4xl text-red-500"></i> : <i className="fa-solid fa-circle-check text-4xl"></i>}
                        </div>
                        <p className="text-white text-xs font-medium mb-6 whitespace-pre-line">{message}</p>
                        <button onClick={onClose} className={btnClass + " w-full"}>Tutup</button>
                    </div>
                </div>
            );
        }

        function App() {
            const [activeTab, setActiveTab] = useState('online');
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [pendingTab, setPendingTab] = useState(null);
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [loginPassword, setLoginPassword] = useState('');
            const [loginError, setLoginError] = useState('');

            const [menus, setMenus] = useState(() => JSON.parse(localStorage.getItem('latansa_menus')) || [...INITIAL_SPECIAL, ...INITIAL_PACKAGES, ...INITIAL_MENU]);
            
            const [transactions, setTransactions] = useState(() => {
                const saved = localStorage.getItem('latansa_transactions_global');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) {}
                }
                return [];
            });

            const [adminQrisUrl, setAdminQrisUrl] = useState(() => localStorage.getItem('latansa_qris') || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&h=300&fit=crop');
            
            const [storeStatus, setStoreStatus] = useState(() => JSON.parse(localStorage.getItem('latansa_store_status')) || {
                onlineOpen: true, onlineReason: 'Toko Buka',
                posOpen: true, posReason: 'Kasir Buka'
            });

            const [modalConfig, setModalConfig] = useState({ isOpen: false, message: '', type: 'error' });
            const [showReceipt, setShowReceipt] = useState(false);
            const [currentReceiptData, setCurrentReceiptData] = useState(null);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const receiptImageRef = useRef(null);

            useEffect(() => { localStorage.setItem('latansa_menus', JSON.stringify(menus)); }, [menus]);
            useEffect(() => { localStorage.setItem('latansa_transactions_global', JSON.stringify(transactions)); }, [transactions]);
            useEffect(() => { localStorage.setItem('latansa_qris', adminQrisUrl); }, [adminQrisUrl]);
            useEffect(() => { localStorage.setItem('latansa_store_status', JSON.stringify(storeStatus)); }, [storeStatus]);

            const showAlert = (message, type = 'error') => setModalConfig({ isOpen: true, message, type });
            const closeAlert = () => setModalConfig({ ...modalConfig, isOpen: false });

            const handleNavClick = (tab) => {
                if (tab === 'online') {
                    setActiveTab('online');
                } else if (tab === 'kasir') {
                    setActiveTab('kasir');
                } else {
                    if (isLoggedIn) {
                        setActiveTab(tab);
                    } else {
                        setPendingTab(tab);
                        setShowLoginModal(true);
                        setLoginPassword('');
                        setLoginError('');
                    }
                }
            };

            const handleLoginSubmit = (e) => {
                e.preventDefault();
                if (loginPassword === 'latansacafe123') {
                    setIsLoggedIn(true);
                    setShowLoginModal(false);
                    setActiveTab(pendingTab || 'admin');
                    setPendingTab(null);
                } else {
                    setLoginError('Sandi salah! Silakan coba lagi.');
                }
            };

            const handleCreateOrder = (orderData) => {
                const newOrder = { id: generateId('ORD'), date: new Date().toLocaleString('id-ID'), ...orderData };
                const isQris = orderData.payment === 'QRIS';
                const trx = {
                    id: generateId('TRX'),
                    date: new Date().toISOString(),
                    type: 'IN',
                    category: isQris ? 'PEMBAYARAN QRIS' : 'PEMBAYARAN CASH',
                    paymentMethod: orderData.payment,
                    amount: orderData.total,
                    note: `${orderData.type === 'Kasir POS' ? 'Kasir POS:' : 'Pemesanan:'} ${newOrder.id} (${orderData.santriName || 'Umum'})`,
                    orderData: newOrder
                };

                setTransactions(prev => [trx, ...prev]);
                setCurrentReceiptData(newOrder);
                setShowReceipt(true);
                
                playOrderSuccessSoundAndSpeech(orderData.total);

                if(orderData.type !== 'Kasir POS') {
                    window.open(generateWaLink(newOrder), '_blank');
                } else {
                    showAlert("Transaksi POS Berhasil Disimpan & Dicatat!", "success");
                }
            };

            const downloadNotaAsText = (ord) => {
                let text = `=====================================\n`;
                text += `      LA-TANSA CAFE & RESTO        \n`;
                text += `    Nota Resmi & Bukti Transaksi     \n`;
                text += `=====================================\n`;
                text += `ID Transaksi   : ${ord.id}\n`;
                text += `Waktu          : ${ord.date}\n`;
                text += `Tipe Pesanan   : ${ord.type}\n`;
                text += `Nama Santri    : ${ord.santriName || '-'}\n`;
                text += `Kelas / Rayon  : ${ord.santriClass || '-'} / ${ord.santriRayon || '-'}\n`;
                text += `Jam Pengambilan: ${ord.pickupTime || '-'}\n`;
                text += `Catatan        : ${ord.catatan || '-'}\n`;
                text += `Pembayaran     : ${ord.payment}\n`;
                text += `-------------------------------------\n`;
                text += `DAFTAR PESANAN:\n`;
                ord.itemsList?.forEach((i, idx) => {
                    text += `${idx + 1}. ${i.name} (${i.qty}x) - Rp ${(i.price * i.qty).toLocaleString()}\n`;
                });
                text += `-------------------------------------\n`;
                text += `TOTAL PEMBAYARAN : Rp ${ord.total.toLocaleString()}\n`;
                text += `=====================================\n`;
                text += `   Terima Kasih - Anda Berbelanja,   \n`;
                text += `          Anda Beramal.              \n`;
                text += `=====================================\n`;

                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Nota-LaTansa-${ord.id}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const sendReceiptAsImageToWhatsApp = async () => {
                if (!receiptImageRef.current) return;
                try {
                    const canvas = await html2canvas(receiptImageRef.current, { scale: 2, backgroundColor: '#FFFFFF' });
                    canvas.toBlob(blob => {
                        const file = new File([blob], `Nota-${currentReceiptData.id}.png`, { type: 'image/png' });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            navigator.share({
                                files: [file],
                                title: `Nota Pesanan La-Tansa ${currentReceiptData.id}`,
                                text: `Struk Resmi Pesanan Atas Nama Santri: ${currentReceiptData.santriName || '-'}`
                            }).catch(() => {});
                        } else {
                            const imageUrl = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = imageUrl;
                            a.download = `Nota-${currentReceiptData.id}.png`;
                            a.click();
                            window.open(generateWaLink(currentReceiptData), '_blank');
                            showAlert("Gambar nota estetis telah di-download & WhatsApp admin dibuka. Anda dapat melampirkan gambar tersebut di chat WhatsApp!", "success");
                        }
                    }, 'image/png');
                } catch(err) {
                    console.error("Image generation error:", err);
                    window.open(generateWaLink(currentReceiptData), '_blank');
                }
            };

            const currentDateStr = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            return (
                <div className="h-screen w-screen flex flex-col md:flex-row overflow-hidden bg-transparent">
                    <div className="fixed top-[-20%] left-[-10%] w-[50%] h-[50%] bg-[#D4AF37] opacity-15 rounded-full blur-[140px] pointer-events-none animate-blob z-0"></div>
                    
                    <CustomModal isOpen={modalConfig.isOpen} message={modalConfig.message} type={modalConfig.type} onClose={closeAlert} />

                    {showLoginModal && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
                            <div className="bg-[#141414] border-2 border-[#D4AF37] p-8 rounded-2xl max-w-md w-full relative shadow-2xl">
                                <button onClick={() => setShowLoginModal(false)} className="absolute top-4 right-4 text-[#9CA3AF] hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
                                <div className="text-center mb-6">
                                    <h3 className="text-xl font-serif font-bold text-[#D4AF37]">Autentikasi Staf / Admin</h3>
                                    <p className="text-xs text-[#9CA3AF] mt-1">Masukkan sandi untuk mengakses Dasbor Admin</p>
                                </div>
                                <form onSubmit={handleLoginSubmit} className="space-y-4">
                                    <input type="password" required placeholder="Masukkan sandi..." value={loginPassword} onChange={e => setLoginPassword(e.target.value)} className={inputClass} autoFocus />
                                    {loginError && <p className="text-xs text-red-500 font-medium text-center">{loginError}</p>}
                                    <button type="submit" className={btnClass + " w-full py-2.5"}>Masuk Sistem</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showReceipt && currentReceiptData && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/90 p-4 no-print">
                            <div className="bg-[#111111] border border-[#D4AF37]/60 max-w-sm w-full relative shadow-2xl rounded-2xl overflow-hidden flex flex-col max-h-[90vh]">
                                <button onClick={() => setShowReceipt(false)} className="absolute top-4 right-4 text-gray-400 hover:text-white z-20"><i className="fa-solid fa-xmark text-lg"></i></button>
                                
                                <div ref={receiptImageRef} className="p-6 bg-white text-gray-900 font-sans overflow-y-auto space-y-4">
                                    <div className="text-center border-b border-gray-200 pb-4 relative">
                                        <div className="absolute top-0 right-0 text-amber-500/10 text-5xl pointer-events-none"><i className="fa-solid fa-crown"></i></div>
                                        <span className="text-[9px] bg-amber-50 text-amber-800 border border-amber-300 px-2.5 py-0.5 rounded-full font-bold uppercase tracking-widest">E-Receipt Resmi</span>
                                        <h3 className="text-amber-800 font-serif font-bold text-lg mt-2 tracking-wide">LA-TANSA CAFE & RESTO</h3>
                                        <p className="text-[10px] text-gray-500 tracking-wider">Pusat Kuliner & Beramal</p>
                                        <div className="text-[9px] text-gray-400 mt-1">{currentReceiptData.date}</div>
                                    </div>

                                    <div className="bg-amber-50/50 p-3 rounded-xl border border-amber-200 space-y-1.5 text-xs text-gray-800">
                                        <div className="flex justify-between"><span className="text-gray-500">ID Transaksi:</span><span className="font-mono text-amber-800 font-bold">{currentReceiptData.id}</span></div>
                                        <div className="flex justify-between"><span className="text-gray-500">Nama Santri:</span><span className="font-semibold text-gray-900">{currentReceiptData.santriName || '-'}</span></div>
                                        <div className="flex justify-between"><span className="text-gray-500">Kelas / Rayon:</span><span className="text-gray-700">{currentReceiptData.santriClass || '-'} / {currentReceiptData.santriRayon || '-'}</span></div>
                                        <div className="flex justify-between"><span className="text-gray-500">Jam Pengambilan:</span><span className="text-amber-700 font-bold">{currentReceiptData.pickupTime || '-'}</span></div>
                                        <div className="flex justify-between"><span className="text-gray-500">Catatan:</span><span className="text-gray-600 italic">{currentReceiptData.catatan || '-'}</span></div>
                                        <div className="flex justify-between"><span className="text-gray-500">Pembayaran:</span><span className="text-emerald-700 font-bold uppercase">{currentReceiptData.payment}</span></div>
                                    </div>

                                    <div>
                                        <div className="text-[10px] text-amber-800 font-bold uppercase tracking-wider mb-2 border-b border-gray-200 pb-1">Daftar Pesanan</div>
                                        <div className="space-y-2">
                                            {currentReceiptData.itemsList?.map((i, idx) => (
                                                <div key={idx} className="flex justify-between items-center text-xs bg-gray-50 p-2 rounded-lg border border-gray-200">
                                                    <div>
                                                        <div className="font-bold text-gray-900">{i.name}</div>
                                                        <div className="text-[10px] text-gray-500">{i.qty}x @ Rp {i.price.toLocaleString()}</div>
                                                    </div>
                                                    <div className="text-amber-800 font-bold font-mono">Rp {(i.price * i.qty).toLocaleString()}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="bg-amber-100/70 p-3 rounded-xl border border-amber-300 flex justify-between items-center">
                                        <span className="text-xs font-bold text-amber-900 uppercase tracking-wider">Total Pembayaran</span>
                                        <span className="text-base font-bold text-gray-900 font-mono">Rp {currentReceiptData.total.toLocaleString()}</span>
                                    </div>

                                    {currentReceiptData.qrisProof && (
                                        <div className="text-center pt-2 border-t border-gray-200">
                                            <div className="text-[10px] text-gray-500 mb-1">Bukti QRIS Terlampir</div>
                                            <img src={currentReceiptData.qrisProof} className="w-20 h-20 object-contain mx-auto rounded border border-gray-300 bg-white p-1" />
                                        </div>
                                    )}

                                    <div className="text-center pt-3 border-t border-dashed border-gray-300 text-[10px] text-amber-800 italic font-medium">
                                        "Terima Kasih Telah Berbelanja & Beramal"
                                    </div>
                                </div>

                                <div className="p-4 bg-[#141414] border-t border-gray-800 space-y-2 no-print">
                                    <button onClick={sendReceiptAsImageToWhatsApp} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 px-3 rounded-xl font-bold text-xs uppercase tracking-wider transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-900/50"><i className="fa-brands fa-whatsapp text-sm"></i> Kirim Struk Estetis ke WA Admin</button>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button onClick={() => window.print()} className={btnClass + " w-full !py-2"}><i className="fa-solid fa-print mr-1"></i> Cetak</button>
                                        <button onClick={() => downloadNotaAsText(currentReceiptData)} className="bg-gray-800 hover:bg-gray-700 text-[#D4AF37] border border-[#D4AF37]/50 py-2 px-3 rounded-xl font-bold text-xs uppercase tracking-wider transition-all"><i className="fa-solid fa-download mr-1"></i> Download</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="md:hidden flex justify-between items-center bg-[#0A0A0A]/95 border-b border-[#D4AF37]/20 px-4 py-3 z-30 shrink-0">
                        <div>
                            <h1 className="text-lg font-serif font-bold text-[#D4AF37]">La-Tansa</h1>
                            <p className="text-[9px] text-gray-400 uppercase tracking-widest">Cafe & Resto</p>
                        </div>
                        <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="text-[#D4AF37] text-xl p-2">
                            <i className={`fa-solid ${mobileMenuOpen ? 'fa-xmark' : 'fa-bars'}`}></i>
                        </button>
                    </div>

                    {mobileMenuOpen && (
                        <div className="md:hidden absolute top-[57px] left-0 right-0 bg-[#0A0A0A] border-b border-[#D4AF37]/30 p-4 z-40 space-y-2 shadow-2xl">
                            <button onClick={()=>{handleNavClick('online'); setMobileMenuOpen(false);}} className={`w-full text-left p-2.5 rounded font-bold text-xs ${activeTab==='online'?'bg-[#D4AF37] text-black':'text-gray-300'}`}><i className="fa-solid fa-bag-shopping mr-2"></i> Pemesanan Online</button>
                            <button onClick={()=>{handleNavClick('kasir'); setMobileMenuOpen(false);}} className={`w-full text-left p-2.5 rounded font-bold text-xs ${activeTab==='kasir'?'bg-[#D4AF37] text-black':'text-gray-300'}`}><i className="fa-solid fa-cash-register mr-2"></i> Kasir POS</button>
                            <button onClick={()=>{handleNavClick('admin'); setMobileMenuOpen(false);}} className={`w-full text-left p-2.5 rounded font-bold text-xs ${activeTab==='admin'?'bg-[#D4AF37] text-black':'text-gray-300'}`}><i className="fa-solid fa-chart-line mr-2"></i> Dasbor Admin {!isLoggedIn && <i className="fa-solid fa-lock text-[10px] ml-1"></i>}</button>
                        </div>
                    )}

                    <nav className="no-print hidden md:flex w-64 bg-[#0A0A0A]/90 border-r border-[#D4AF37]/20 p-6 flex-col justify-between z-10 relative backdrop-blur-md shrink-0">
                        <div>
                            <div className="mb-6">
                                <h1 className="text-2xl font-serif font-bold text-[#D4AF37] tracking-tight">La-Tansa</h1>
                                <p className="text-[10px] text-gray-400 uppercase tracking-widest mt-0.5">Cafe & Resto</p>
                                <div className="mt-2 text-[9px] text-[#D4AF37] font-bold uppercase border border-[#D4AF37]/30 inline-block px-2 py-0.5 rounded">Anda Belanja, Anda Beramal</div>
                            </div>
                            <div className="flex flex-col gap-2">
                                <button onClick={()=>handleNavClick('online')} className={`flex items-center gap-3 p-3 rounded-lg text-xs font-bold transition-all text-left ${activeTab === 'online' ? 'bg-[#D4AF37] text-black shadow-lg shadow-[#D4AF37]/25 font-extrabold' : 'text-gray-400 hover:bg-[#1A1A1A] hover:text-[#D4AF37]'}`}><i className="fa-solid fa-bag-shopping w-4"></i> Pemesanan Online</button>
                                <button onClick={()=>handleNavClick('kasir')} className={`flex items-center gap-3 p-3 rounded-lg text-xs font-bold transition-all text-left ${activeTab === 'kasir' ? 'bg-[#D4AF37] text-black shadow-lg shadow-[#D4AF37]/25 font-extrabold' : 'text-gray-400 hover:bg-[#1A1A1A] hover:text-[#D4AF37]'}`}><i className="fa-solid fa-cash-register w-4"></i> Kasir POS</button>
                                <button onClick={()=>handleNavClick('admin')} className={`flex items-center justify-between p-3 rounded-lg text-xs font-bold transition-all text-left ${activeTab === 'admin' ? 'bg-[#D4AF37] text-black shadow-lg shadow-[#D4AF37]/25 font-extrabold' : 'text-gray-400 hover:bg-[#1A1A1A] hover:text-[#D4AF37]'}`}>
                                    <span className="flex items-center gap-3"><i className="fa-solid fa-chart-line w-4"></i> Dasbor Admin</span>
                                    {!isLoggedIn && <i className="fa-solid fa-lock text-[10px]"></i>}
                                </button>
                            </div>
                        </div>

                        <div className="pt-4 border-t border-gray-800 text-[10px] text-gray-400 space-y-1">
                            <div>{currentDateStr}</div>
                            <div className="pt-2 flex items-center justify-between">
                                <span className="text-gray-400">Staf Admin</span>
                                <span className={`font-bold cursor-pointer ${isLoggedIn ? 'text-green-400 hover:underline' : 'text-gray-500'}`} onClick={()=>{ if(isLoggedIn) { setIsLoggedIn(false); showAlert("Berhasil keluar sesi admin.", "success"); } else handleNavClick('admin'); }}>{isLoggedIn ? 'Logout' : 'Login Admin'}</span>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-1 p-3 md:p-6 overflow-hidden z-10 relative h-full flex">
                        {activeTab === 'online' && <OnlineOrdering menus={menus} adminQrisUrl={adminQrisUrl} onCreateOrder={handleCreateOrder} showAlert={showAlert} storeStatus={storeStatus} />}
                        {activeTab === 'kasir' && <POSKasir menus={menus} adminQrisUrl={adminQrisUrl} onCreateOrder={handleCreateOrder} showAlert={showAlert} storeStatus={storeStatus} />}
                        {activeTab === 'admin' && <AdminDashboard transactions={transactions} setTransactions={setTransactions} menus={menus} setMenus={setMenus} adminQrisUrl={adminQrisUrl} setAdminQrisUrl={setAdminQrisUrl} showAlert={showAlert} storeStatus={storeStatus} setStoreStatus={setStoreStatus} downloadNotaAsText={downloadNotaAsText} />}
                    </main>
                </div>
            );
        }

        function OnlineOrdering({ menus, adminQrisUrl, onCreateOrder, showAlert, storeStatus }) {
            const [cart, setCart] = useState([]);
            const [formTab, setFormTab] = useState('santri'); 
            const [selectedCategory, setSelectedCategory] = useState('Semua');
            
            const [santriForm, setSantriForm] = useState({ 
                namaPemesan: '', namaSantri: '', kelas: '', rayon: '', pickupTime: '', catatan: '', metode: 'QRIS', qrisProof: '' 
            });
            const [ifthorForm, setIfthorForm] = useState({ 
                wali: '', kelas: '', rayon: '', hari: 'Senin', pickupTime: 'Maghrib', pilihanNasi: 'Nasi Daun Jeruk', catatan: '', metode: 'QRIS', qrisProof: '' 
            });

            if(!storeStatus.onlineOpen) {
                return (
                    <div className="flex flex-col items-center justify-center h-full w-full text-center p-8">
                        <div className="bg-[#141414] border-2 border-red-500/50 p-8 rounded-2xl max-w-lg w-full shadow-2xl space-y-4">
                            <i className="fa-solid fa-store-slash text-5xl text-red-500 mb-2"></i>
                            <h2 className="text-xl font-serif font-bold text-white">Pemesanan Online Sedang Tutup</h2>
                            <p className="text-gray-400 text-xs bg-black p-4 rounded border border-gray-800">{storeStatus.onlineReason || 'Tutup sementara.'}</p>
                        </div>
                    </div>
                );
            }

            const addToCart = (item) => {
                if (!item.available) return showAlert("Maaf, menu ini sedang HABIS!");
                setCart(prev => { const ex = prev.find(c => c.id === item.id); return ex ? prev.map(c => c.id === item.id ? {...c, qty: c.qty + 1} : c) : [...prev, {...item, qty: 1}]; });
            };
            const removeCart = (id) => setCart(prev => { const ex = prev.find(c => c.id === id); return ex.qty > 1 ? prev.map(c => c.id === id ? {...c, qty: c.qty - 1} : c) : prev.filter(c => c.id !== id); });
            const total = cart.reduce((s, c) => s + (c.price * c.qty), 0);

            const categories = ['Semua', 'Spesial', 'Paket', 'Nasi', 'Ayam', 'Ikan', 'Telur', 'Sayur-sayuran', 'Minuman'];
            const filteredMenus = selectedCategory === 'Semua' ? menus : menus.filter(m => m.category === selectedCategory);

            const onSubmit = (e) => {
                e.preventDefault();
                if(!cart.length) return showAlert("Keranjang masih kosong!", "error");
                
                let orderData = {};
                if (formTab === 'santri') {
                    if(!santriForm.namaPemesan || !santriForm.namaSantri || !santriForm.kelas || !santriForm.rayon) return showAlert("Lengkapi data santri & asrama/rayon!", "error");
                    orderData = {
                        type: 'Pemesanan Santri',
                        customer: `Wali: ${santriForm.namaPemesan}\nSantri: ${santriForm.namaSantri}`,
                        santriName: santriForm.namaSantri,
                        santriClass: santriForm.kelas,
                        santriRayon: santriForm.rayon,
                        pickupTime: santriForm.pickupTime || '16:00 WIB',
                        catatan: santriForm.catatan || '-',
                        details: `Waktu Pengambilan: ${santriForm.pickupTime}`,
                        payment: santriForm.metode,
                        qrisProof: santriForm.qrisProof,
                        total,
                        itemsList: cart.map(c => ({...c, subtotal: c.price * c.qty}))
                    };
                } else {
                    if(!ifthorForm.wali || !ifthorForm.kelas || !ifthorForm.rayon) return showAlert("Lengkapi data Ifthor & asrama/rayon!", "error");
                    orderData = {
                        type: 'Pemesanan Ifthor Jama\'i',
                        customer: `Wali Kelas: ${ifthorForm.wali}\nKelas: ${ifthorForm.kelas} (${ifthorForm.hari})`,
                        santriName: `Ifthor Jama'i (${ifthorForm.wali})`,
                        santriClass: ifthorForm.kelas,
                        santriRayon: `${ifthorForm.rayon} (Hari: ${ifthorForm.hari})`,
                        pickupTime: ifthorForm.pickupTime || 'Maghrib',
                        catatan: ifthorForm.catatan || '-',
                        details: `Nasi: ${ifthorForm.pilihanNasi}, Hari: ${ifthorForm.hari}`,
                        payment: ifthorForm.metode,
                        qrisProof: ifthorForm.qrisProof,
                        total,
                        itemsList: cart.map(c => ({...c, subtotal: c.price * c.qty}))
                    };
                }
                
                onCreateOrder(orderData);
                setCart([]);
            };

            return (
                <div className="flex flex-col lg:flex-row gap-4 h-full w-full overflow-hidden">
                    <div className="flex-1 lg:flex-[1.6] h-full overflow-y-auto pr-2 flex flex-col">
                        <div className="flex items-center gap-2 overflow-x-auto pb-3 shrink-0">
                            {categories.map(cat => (
                                <button key={cat} onClick={()=>setSelectedCategory(cat)} className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${selectedCategory === cat ? 'bg-[#D4AF37] text-black shadow-lg shadow-[#D4AF37]/30' : 'bg-[#141414] text-gray-400 hover:text-white border border-gray-800'}`}>
                                    {cat}
                                </button>
                            ))}
                        </div>

                        <div className="flex-1 overflow-y-auto pr-1 pb-4">
                            <div className="grid grid-cols-2 gap-3">
                                {filteredMenus.map(m => {
                                    const inCart = cart.find(c => c.id === m.id);
                                    const isSpecial = m.category === 'Spesial';
                                    const isPackage = m.category === 'Paket';
                                    const cardStyleClass = isSpecial ? "special-glow" : (isPackage ? "package-glow" : "bg-[#121212]/95 border-gray-800");

                                    return (
                                        <div key={m.id} className={`rounded-xl overflow-hidden p-3 flex flex-col justify-between border relative menu-card-hover ${cardStyleClass} ${!m.available ? 'opacity-60 grayscale' : ''}`}>
                                            {isSpecial && (
                                                <div className="absolute top-2 right-2 bg-gradient-to-r from-[#D4AF37] to-amber-600 text-black text-[9px] font-extrabold px-2 py-0.5 rounded-full shadow z-10 tracking-widest uppercase">
                                                    <i className="fa-solid fa-crown mr-1"></i> Spesial
                                                </div>
                                            )}
                                            {isPackage && (
                                                <div className="absolute top-2 right-2 bg-[#1A1A1A] border border-[#D4AF37]/60 text-[#D4AF37] text-[9px] font-bold px-2 py-0.5 rounded-full shadow z-10 tracking-wider uppercase">
                                                    <i className="fa-solid fa-box-open mr-1"></i> Paket Pilihan
                                                </div>
                                            )}
                                            {inCart && <span className="absolute top-2 left-2 bg-[#D4AF37] text-black text-[10px] font-bold px-2 py-0.5 rounded z-10 flex items-center gap-1"><i className="fa-solid fa-plus text-[8px]"></i> {inCart.qty}</span>}
                                            {!m.available && <div className="absolute inset-0 bg-black/70 z-20 flex items-center justify-center font-bold text-red-500 text-xs tracking-wider uppercase border border-red-500/50 rounded-xl">Menu Habis</div>}
                                            
                                            <div>
                                                <div className="relative overflow-hidden rounded mb-2">
                                                    <img src={m.image} className="w-full h-24 sm:h-28 object-cover rounded transition-transform duration-500 hover:scale-110" />
                                                    <span className="absolute bottom-1 right-1 bg-black/80 text-[#D4AF37] text-[9px] px-1.5 py-0.5 rounded border border-[#D4AF37]/40 font-bold uppercase">{m.category}</span>
                                                </div>
                                                <div className="text-xs font-serif font-bold text-white truncate">{m.name}</div>
                                                <p className="text-[10px] text-gray-300 mt-0.5 line-clamp-1">{m.description}</p>
                                                <div className="text-[#D4AF37] text-xs font-extrabold mt-1">Rp {m.price.toLocaleString()}</div>
                                            </div>

                                            <div className="mt-3">
                                                {inCart ? (
                                                    <div className="flex items-center justify-between w-full bg-black border border-[#D4AF37] rounded px-2 py-1">
                                                        <button onClick={()=>removeCart(m.id)} className="text-[#D4AF37] font-bold px-2"><i className="fa-solid fa-minus text-[10px]"></i></button>
                                                        <span className="text-xs font-bold text-white">{inCart.qty}</span>
                                                        <button onClick={()=>addToCart(m)} className="text-[#D4AF37] font-bold px-2"><i className="fa-solid fa-plus text-[10px]"></i></button>
                                                    </div>
                                                ) : (
                                                    <button disabled={!m.available} onClick={()=>addToCart(m)} className={btnClass + " w-full !py-1 text-[11px]"}>
                                                        {m.available ? '+ Tambah' : 'Habis'}
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 lg:flex-[1.1] h-full overflow-y-auto pr-1 space-y-4">
                        <div className="flex bg-[#0A0A0A] rounded-lg p-1 border border-gray-800">
                            <button onClick={()=>setFormTab('santri')} className={`flex-1 py-1.5 text-xs font-bold rounded transition-all ${formTab === 'santri' ? 'bg-[#D4AF37] text-black shadow' : 'text-gray-400'}`}>Pemesanan Santri</button>
                            <button onClick={()=>setFormTab('ifthor')} className={`flex-1 py-1.5 text-xs font-bold rounded transition-all ${formTab === 'ifthor' ? 'bg-[#D4AF37] text-black shadow' : 'text-gray-400'}`}>Ifthor Jama'i</button>
                        </div>

                        <div className={cardClass}>
                            <h3 className="text-sm font-serif font-bold text-[#D4AF37] mb-1">{formTab === 'santri' ? 'Formulir Pemesanan Santri' : 'Formulir Ifthor Jama\'i'}</h3>
                            <p className="text-[10px] text-gray-400 mb-4">Silakan isi detail pesanan Anda dengan lengkap.</p>

                            <form onSubmit={onSubmit} className="space-y-3">
                                {formTab === 'santri' ? (
                                    <div className="space-y-2.5">
                                        <div>
                                            <label className="text-[10px] text-[#D4AF37] uppercase font-bold block mb-1">NAMA PEMESAN (WALI)</label>
                                            <input required placeholder="Nama Anda..." value={santriForm.namaPemesan} onChange={e=>setSantriForm({...santriForm, namaPemesan: e.target.value})} className={inputClass} />
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-[#D4AF37] uppercase font-bold block mb-1">NAMA SANTRI</label>
                                            <input required placeholder="Nama santri..." value={santriForm.namaSantri} onChange={e=>setSantriForm({...santriForm, namaSantri: e.target.value})} className={inputClass} />
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="text-[10px] text-[#D4AF37] uppercase font-bold block mb-1">KELAS</label>
                                                <input required placeholder="Misal: 7A" value={santriForm.kelas} onChange={e=>setSantriForm({...santriForm, kelas: e.target.value})} className={inputClass} />
                                            </div>
                                            <div>
                                                <label className="text-[10px] text-[#D4AF37] uppercase font-bold block mb-1">ASRAMA / RAYON</label>
                                                <input required placeholder="Misal: Rayon A" value={santriForm.rayon} onChange={e=>setSantriForm({...santriForm, rayon: e.target.value})} className={inputClass} />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-[#D4AF37] uppercase font-bold block mb-1">WAKTU PENGAMBILAN</label>
                                            <input required placeholder="Contoh: 16:30 WIB" value={santriForm.pickupTime} onChange={e=>setSantriForm({...santriForm, pickupTime: e.target.value})} className={inputClass} />
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-[#D4AF37] uppercase font-bold block mb-1">CATATAN OPSIONAL</label>
                                            <input placeholder="Contoh: Jangan pakai pedas..." value={santriForm.catatan} onChange={e=>setSantriForm({...santriForm, catatan: e.target.value})} className={inputClass} />
                                        </div>
                                    </div>
                                ) : (
                                    <div className="space-y-2.5">
                                        <div>
                                            <label className="text-[10px] text-[#D4AF37] uppercase font-bold block mb-1">NAMA WALI KELAS (PEMESAN)</label>
                                            <input required placeholder="Nama Anda..." value={ifthorForm.wali} onChange={e=>setIfthorForm({...ifthorForm, wali: e.target.value})} className={inputClass} />
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="text-[10px] text-[#D4AF37] uppercase font-bold block mb-1">KELAS</label>
                                                <input required placeholder="Misal: X-B" value={ifthorForm.kelas} onChange={e=>setIfthorForm({...ifthorForm, kelas: e.target.value})} className={inputClass} />
                                            </div>
                                            <div>
                                                <label className="text-[10px] text-[#D4AF37] uppercase font-bold block mb-1">ASRAMA / RAYON</label>
                                                <input required placeholder="Misal: Rayon B" value={ifthorForm.rayon} onChange={e=>setIfthorForm({...ifthorForm, rayon: e.target.value})} className={inputClass} />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-[#D4AF37] uppercase font-bold block mb-1">PILIHAN NASI</label>
                                            <select value={ifthorForm.pilihanNasi} onChange={e=>setIfthorForm({...ifthorForm, pilihanNasi: e.target.value})} className={inputClass}>
                                                <option value="Nasi Daun Jeruk">Nasi Daun Jeruk</option>
                                                <option value="Nasi Putih">Nasi Putih</option>
                                                <option value="Nasi Kuning">Nasi Kuning</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-[#D4AF37] uppercase font-bold block mb-1">HARI ACARA (Hanya Senin & Kamis)</label>
                                            <select value={ifthorForm.hari} onChange={e=>setIfthorForm({...ifthorForm, hari: e.target.value})} className={inputClass}>
                                                <option value="Senin">Hari Senin</option>
                                                <option value="Kamis">Hari Kamis</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-[#D4AF37] uppercase font-bold block mb-1">JAM PENGAMBILAN</label>
                                            <input required placeholder="Contoh: Maghrib" value={ifthorForm.pickupTime} onChange={e=>setIfthorForm({...ifthorForm, pickupTime: e.target.value})} className={inputClass} />
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-[#D4AF37] uppercase font-bold block mb-1">CATATAN OPSIONAL</label>

                                <div className="space-y-2 pt-2 border-t border-gray-800">
                                    <label className="text-[10px] text-[#D4AF37] uppercase font-bold block">METODE PEMBAYARAN</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button type="button" onClick={()=>{

                                            <i className="fa-solid fa-qrcode mr-1"></i> QRIS Resmi
                                        </button>
                                        <button type="button" onClick={()=>{
                                            if(formTab === 'santri') setSantriForm({...santriForm, metode: 'Tunai'});
                                            else setIfthorForm({...ifthorForm, metode: 'Tunai'});
                                        }} className={`py-2 text-xs font-bold rounded border transition-all ${(formTab === 'santri' ? santriForm.metode : ifthorForm.metode) === 'Tunai' ? 'bg-[#D4AF37] text-black border-[#D4AF37] shadow' : 'bg-black text-gray-300 border-gray-800 hover:border-[#D4AF37]/50'}`}>
                                            <i className="fa-solid fa-money-bill-wave mr-1"></i> Tunai (Cash)

                                    {((formTab === 'santri' ? santriForm.metode : ifthorForm.metode) === 'QRIS') && (
                                        <div className="bg-black p-3 rounded border border-[#D4AF37]/30 text-center space-y-2">

                                                        else setIfthorForm({...ifthorForm, qrisProof: r.result});

                                                    r.readAsDataURL(f);
